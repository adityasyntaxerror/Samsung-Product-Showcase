{% extends "Samsung_App/base.html" %}
{% block title %}Sign up — Samsung Showcase{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-panel">
        <p class="eyebrow">JOIN THE GALAXY</p>
        <h1>Create an account</h1>
        <form method="post" action="{% url 'signup' %}" class="auth-form" id="signup-form">
            {% csrf_token %}
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" value="{{ form_data.name }}" autocomplete="name" required>

            <label for="username">Username</label>
            <input id="username" name="username" type="text" value="{{ form_data.username }}" autocomplete="username" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="{{ form_data.email }}" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>

            <button class="button button-dark" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
        <a class="text-link" href="{% url 'home' %}">← Back to Home</a>
    </div>
</section>
{% endblock %}
