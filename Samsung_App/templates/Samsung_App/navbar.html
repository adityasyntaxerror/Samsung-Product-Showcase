<header class="site-header main-header">
    <a class="logo" href="{% url 'home' %}" aria-label="Samsung Showcase — go to Home">
        {% if site_images.logo.url %}
            <img src="{{ site_images.logo.url }}" alt="{{ site_images.logo.alt|default:'Samsung Showcase' }}" onerror="this.replaceWith(document.createTextNode('SAMSUNG'))">
        {% else %}
            <span class="logo-text">SAMSUNG</span>
        {% endif %}
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-navigation">Menu</button>
    <nav class="main-navigation" id="main-navigation" aria-label="Main navigation">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'products' %}">Products</a>
        <a href="{% url 'products' %}?category=phones">Phones</a>
        <a href="{% url 'products' %}?category=tv-av">TV &amp; AV</a>
        <a href="{% url 'about' %}">About</a>
    </nav>
    <div class="account-actions">
        {% if user.is_authenticated %}
            <span>Hi, {{ user.first_name|default:user.username }}</span>
            <form class="logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="link-button" type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Log in</a>
            <a class="signup-link" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </div>
</header>
